name: Aggiorna dashboard turismo

# Si avvia da solo ogni lunedì mattina, oppure con un clic:
# GitHub > scheda "Actions" > "Aggiorna dashboard turismo" > "Run workflow".
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i dati e rigenera la dashboard
        run: python3 tools/turismo/build_dashboard.py
      - name: Piombino in numeri (Atlante statistico dei comuni ISTAT)
        run: |
          python3 tools/lente/aggiorna_dati.py
          python3 tools/lente/build_lente.py
      - name: Salva le novità sul sito
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/turismo/raw tools/turismo/raw_saiku tools/turismo/dati_puliti turismo docs/turismo tools/lente/raw lente docs/lente
          if git diff --cached --quiet -- tools/turismo/raw tools/turismo/raw_saiku tools/lente/raw; then
            echo "Nessun dato nuovo: niente da pubblicare."
            exit 0
          fi
          git commit -m "Dashboard: dati aggiornati"
          git push
